<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STL Price Calculator</title>
<script>
    if (
        localStorage.theme === "dark" || (!("theme" in localStorage) && window.matchMedia("(prefers-color-scheme:dark)").matches)
    ){
        document.documentElement.classList.add("dark");
    }else {
        document.documentElement.classList.remove("dark");
    }
</script>
<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

</head>

<body class="bg-gray-100 dark:bg-gray-900 min-h-screen transition-colors duration-300">

<div class="max-w-6xl mx-auto p-4 sm:p-6">

  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-xl sm:text-2xl font-bold text-gray-800 dark:text-white">
      STL Price Calculator
    </h1>

    <div class="flex gap-2">
      <button id="themeToggle"
        class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-sm dark:text-white">
        🌙 Dark Mode
      </button>

      <button id="fullscreenBtn"
        class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700 text-sm dark:text-white">
        🔍 Fullscreen Preview
      </button>
    </div>
  </div>

  <div class="flex flex-col lg:flex-row gap-6">

    <!-- LEFT PANEL -->
    <div class="w-full lg:w-1/2 bg-white dark:bg-gray-800 shadow-lg rounded-2xl p-4 sm:p-6 transition-colors duration-300">

      <!-- Drop -->
      <div id="dropZone"
        class="border-2 border-dashed border-gray-400 dark:border-gray-600
               rounded-xl p-6 sm:p-8 text-center cursor-pointer
               hover:bg-gray-50 dark:hover:bg-gray-700 transition">

        <p class="text-gray-600 dark:text-gray-300 text-sm sm:text-base">
          Drag & Drop STL file
        </p>

        <input type="file"
               id="fileInput"
               accept=".stl"
               class="mt-4 w-full text-sm dark:text-white">
      </div>

      <!-- Material -->
      <div class="mt-4">
        <label class="block mb-2 font-medium text-gray-700 dark:text-gray-300">
          Material
        </label>
        <select id="materialSelect"
          class="w-full p-3 border rounded-lg
                 bg-white dark:bg-gray-700
                 dark:text-white dark:border-gray-600">
          <option value="pla">PLA</option>
          <option value="abs">ABS</option>
          <option value="resin">Resin</option>
        </select>
      </div>

      <!-- Infill Percentage -->
      <div class="mt-4">
        <label class="block mb-2 font-medium text-gray-700 dark:text-gray-300">
          Infill Percentage
        </label>
        <input type="number" id="infillInput" min="0" max="100" value="20"
          class="w-full p-3 border rounded-lg
                 bg-white dark:bg-gray-700
                 dark:text-white dark:border-gray-600">
      </div>

      <!-- Currency -->
      <div class="mt-4">
        <label class="block mb-2 font-medium text-gray-700 dark:text-gray-300">
          Currency
        </label>
        <select id="currencySelect"
          class="w-full p-3 border rounded-lg
                 bg-white dark:bg-gray-700
                 dark:text-white dark:border-gray-600">
          <option value="PHP" selected>PHP (₱)</option>
          <option value="USD">USD ($)</option>
        </select>
      </div>

      <!-- Result -->
      <div id="result"
        class="mt-6 hidden bg-gray-50 dark:bg-gray-700 p-4 rounded-lg">

        <p class="text-gray-700 dark:text-gray-300">
          <strong>Volume:</strong> <span id="volume"></span> mm³
        </p>

        <p class="text-gray-700 dark:text-gray-300">
          <strong>Weight:</strong> <span id="weight"></span> g
        </p>

        <p class="text-gray-700 dark:text-gray-300">
          <strong>Estimated Print Time:</strong> <span id="printTime"></span> hrs
        </p>

        <p class="mt-2 text-lg font-semibold text-gray-900 dark:text-white">
          Price: <span id="price"></span>
        </p>
      </div>

      <p id="loading" class="mt-4 text-blue-500 hidden text-sm">
        Calculating...
      </p>

    </div>

    <!-- RIGHT PANEL -->
    <div class="w-full lg:w-1/2 bg-white dark:bg-gray-800 shadow-lg rounded-2xl p-2 sm:p-4 transition-colors duration-300">
      <div id="viewer"
        class="w-full h-[300px] sm:h-[400px] lg:h-[500px] rounded-xl bg-gray-200 dark:bg-gray-700">
      </div>
    </div>

  </div>
</div>

<!-- Fullscreen overlay -->
<div id="fullscreenOverlay"
     class="fixed inset-0 bg-black z-50 hidden">
  <div id="fullscreenViewer" class="w-full h-full"></div>
  <button id="closeFullscreen"
          class="absolute top-4 right-4 z-60 px-4 py-2 bg-gray-200 dark:bg-gray-700 rounded-lg">
    ❌
  </button>
</div>

<script>
const materialRates = { pla:3, abs:3.5, resin:7 };
const USD_TO_PHP = 56.0;
const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const materialSelect = document.getElementById("materialSelect");
const currencySelect = document.getElementById("currencySelect");
const infillInput = document.getElementById("infillInput");
const volumeSpan = document.getElementById("volume");
const weightSpan = document.getElementById("weight");
const priceSpan = document.getElementById("price");
const printTimeSpan = document.getElementById("printTime");
const resultDiv = document.getElementById("result");
const loadingText = document.getElementById("loading");
let lastVolume = 0;
let lastWeight = 0;
let currentMesh = null;

// THREE.js setup
const scene = new THREE.Scene();

// Set background based on dark mode
function updateSceneBackground() {
    scene.background = document.documentElement.classList.contains("dark") 
        ? new THREE.Color(0x1f2937) 
        : new THREE.Color(0xf3f4f6);
}
updateSceneBackground();
new MutationObserver(updateSceneBackground).observe(document.documentElement, { attributes: true });

// Camera
const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 10000);
camera.position.set(0, 0, 150);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(viewer.clientWidth, viewer.clientHeight);
renderer.shadowMap.enabled = true; // Enable shadows
renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
viewer.appendChild(renderer.domElement);

// Controls
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// LIGHTS
const directionalLight1 = new THREE.DirectionalLight(0xffffff, 1.2);
directionalLight1.position.set(100, 100, 100);
directionalLight1.castShadow = true;
scene.add(directionalLight1);

const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.6);
directionalLight2.position.set(-100, -50, 50);
directionalLight2.castShadow = true;
scene.add(directionalLight2);

// Ambient light
scene.add(new THREE.AmbientLight(0xffffff, 0.4));

// Shadow plane under the mesh for better depth perception
const plane = new THREE.Mesh(
    new THREE.PlaneGeometry(500, 500),
    new THREE.ShadowMaterial({ opacity: 0.2 })
);
plane.rotation.x = -Math.PI / 2;
plane.position.y = -1;
plane.receiveShadow = true;
scene.add(plane);

// Resize function
function resizeRenderer() {
    const width = viewer.clientWidth;
    const height = viewer.clientHeight;
    renderer.setSize(width, height);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
}
window.addEventListener("resize", resizeRenderer);
resizeRenderer();

// Animate loop
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();

/* CREATE MESH WHEN LOADING STL */
function createMesh(geometry) {
    const mesh = new THREE.Mesh(
        geometry,
        new THREE.MeshStandardMaterial({
            color: 0x2563eb,
            metalness: 0.3,
            roughness: 0.4
        })
    );
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
}

/* FILE HANDLING: REPLACE MESH */
function handleFile(file) {
    if (!file) return;
    loadingText.classList.remove("hidden");
    resultDiv.classList.add("hidden");

    const reader = new FileReader();
    reader.onload = function(event) {
        const loader = new THREE.STLLoader();
        const geometry = loader.parse(event.target.result);
        geometry.center();

        const mesh = createMesh(geometry);

        if (currentMesh) scene.remove(currentMesh);
        scene.add(mesh);
        currentMesh = mesh;

        const box = new THREE.Box3().setFromObject(mesh);
        const size = box.getSize(new THREE.Vector3()).length();
        const center = box.getCenter(new THREE.Vector3());

        camera.position.copy(center);
        camera.position.x += size;
        camera.position.y += size;
        camera.position.z += size;
        camera.lookAt(center);

        const volume = calculateVolume(geometry);
        lastVolume = volume;

        volumeSpan.innerText = volume.toFixed(2);
        weightSpan.innerText = lastWeight.toFixed(2);
        priceSpan.innerText = computePrice(volume);

        loadingText.classList.add("hidden");
        resultDiv.classList.remove("hidden");
    };

    reader.readAsArrayBuffer(file);
}

// Volume calc
function calculateVolume(geometry){
  const position = geometry.attributes.position;
  let totalVolume=0;
  for(let i=0;i<position.count;i+=3){
    const p1 = new THREE.Vector3().fromBufferAttribute(position,i);
    const p2 = new THREE.Vector3().fromBufferAttribute(position,i+1);
    const p3 = new THREE.Vector3().fromBufferAttribute(position,i+2);
    totalVolume+=p1.dot(p2.cross(p3))/6.0;
  }
  return Math.abs(totalVolume);
}

// Compute price + weight + print time
function computePrice(volume){
  const material = materialSelect.value;
  const currency = currencySelect.value;
  const infill = Math.min(Math.max(Number(infillInput.value),0),100)/100;

  const materialDensity = {pla:1.24, abs:1.04, resin:1.1};
  const volume_cm3 = volume/1000; // mm³ to cm³
  const weight_g = volume_cm3 * materialDensity[material] * infill; 
  lastWeight = weight_g;

  // Estimate print time: 50 mm³ per hr
  const printTime = (volume*infill)/50; 
  printTimeSpan.innerText = printTime.toFixed(2);

  let pricePHP = weight_g*materialRates[material];
  if(currency==="USD"){
    return "$ "+(pricePHP/USD_TO_PHP).toFixed(2);
  }
  return "₱ "+pricePHP.toFixed(2);
}

// Handle STL file
function handleFile(file){
  if(!file) return;
  loadingText.classList.remove("hidden");
  resultDiv.classList.add("hidden");
  const reader = new FileReader();
  reader.onload = function(event){
    const loader = new THREE.STLLoader();
    const geometry = loader.parse(event.target.result);
    geometry.center();

    const mesh = new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({
      color:0x2563eb, metalness:0.3, roughness:0.4
    }));

    if(currentMesh) scene.remove(currentMesh);
    scene.add(mesh);
    currentMesh = mesh;

    const box = new THREE.Box3().setFromObject(mesh);
    const size = box.getSize(new THREE.Vector3()).length();
    const center = box.getCenter(new THREE.Vector3());

    camera.position.copy(center);
    camera.position.x+=size; camera.position.y+=size; camera.position.z+=size;
    camera.lookAt(center);

    const volume = calculateVolume(geometry);
    lastVolume = volume;

    volumeSpan.innerText = volume.toFixed(2);
    weightSpan.innerText = lastWeight.toFixed(2);
    priceSpan.innerText = computePrice(volume);

    loadingText.classList.add("hidden");
    resultDiv.classList.remove("hidden");
  };
  reader.readAsArrayBuffer(file);
}

// Events
dropZone.addEventListener("dragover",e=>e.preventDefault());
dropZone.addEventListener("drop",e=>{ e.preventDefault(); handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener("change",e=>handleFile(e.target.files[0]));

materialSelect.addEventListener("change",()=>{ if(lastVolume) priceSpan.innerText = computePrice(lastVolume); });
currencySelect.addEventListener("change",()=>{ if(lastVolume) priceSpan.innerText = computePrice(lastVolume); });
infillInput.addEventListener("change",()=>{ if(lastVolume) priceSpan.innerText = computePrice(lastVolume); });

// Dark mode toggle
const themeToggle = document.getElementById("themeToggle");
themeToggle.addEventListener("click",()=>{
  if(document.documentElement.classList.contains("dark")){
    document.documentElement.classList.remove("dark"); localStorage.theme="light";
  }else{
    document.documentElement.classList.add("dark"); localStorage.theme="dark";
  }
});

// Fullscreen STL preview
const fullscreenOverlay = document.getElementById("fullscreenOverlay");
const fullscreenViewer = document.getElementById("fullscreenViewer");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const closeFullscreen = document.getElementById("closeFullscreen");

let fsRenderer, fsScene, fsCamera, fsControls;

fullscreenBtn.addEventListener("click",()=>{
  if(!currentMesh) return;
  fullscreenOverlay.classList.remove("hidden");

  // Setup fullscreen scene
  fsScene = new THREE.Scene();
  fsScene.background = scene.background.clone();
  fsCamera = new THREE.PerspectiveCamera(75,window.innerWidth/window.innerHeight,0.1,10000);
  fsCamera.position.copy(camera.position);
  fsControls = new THREE.OrbitControls(fsCamera,fullscreenViewer);
  fsControls.enableDamping=true;

  fsRenderer = new THREE.WebGLRenderer({antialias:true});
  fsRenderer.setSize(window.innerWidth,window.innerHeight);
  fullscreenViewer.appendChild(fsRenderer.domElement);

  const meshClone = currentMesh.clone();
  fsScene.add(meshClone);

  const light1 = new THREE.DirectionalLight(0xffffff,1);
  light1.position.set(1,1,1); fsScene.add(light1);
  fsScene.add(new THREE.AmbientLight(0xffffff,0.6));

  function fsAnimate(){ requestAnimationFrame(fsAnimate); fsControls.update(); fsRenderer.render(fsScene,fsCamera); }
  fsAnimate();

  window.addEventListener("resize",()=>{ 
    fsCamera.aspect=window.innerWidth/window.innerHeight; 
    fsCamera.updateProjectionMatrix(); 
    fsRenderer.setSize(window.innerWidth,window.innerHeight); 
  });
});

closeFullscreen.addEventListener("click",()=>{
  fullscreenOverlay.classList.add("hidden");
  fullscreenViewer.innerHTML=""; // remove renderer
});
</script>

</body>
</html>
