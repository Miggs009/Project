<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>STL Price Calculator with Preview</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

<div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-4xl">

  <h1 class="text-2xl font-bold text-center mb-6">
    STL Price Calculator with Preview
  </h1>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <!-- LEFT SIDE -->
    <div>

      <!-- Drop Area -->
      <div id="dropZone"
           class="border-2 border-dashed border-gray-400 rounded-xl p-6 text-center cursor-pointer hover:bg-gray-50 transition">
        <p class="text-gray-600">Drag & Drop STL file here</p>
        <p class="text-sm text-gray-400 mt-2">or</p>
        <input type="file" id="fileInput" accept=".stl" class="mt-4">
      </div>

      <!-- Material -->
      <div class="mt-4">
        <label class="block mb-2 font-medium">Material</label>
        <select id="materialSelect" class="w-full p-2 border rounded-lg">
          <option value="pla">PLA</option>
          <option value="abs">ABS</option>
          <option value="resin">Resin</option>
        </select>
      </div>

      <!-- Currency -->
      <div class="mt-4">
        <label class="block mb-2 font-medium">Currency</label>
        <select id="currencySelect" class="w-full p-2 border rounded-lg">
          <option value="USD">USD ($)</option>
          <option value="PHP">PHP (₱)</option>
        </select>
      </div>

      <!-- Result -->
      <div id="result" class="mt-4 hidden bg-gray-50 p-4 rounded-lg">
        <p><strong>Volume:</strong> <span id="volume"></span> mm³</p>
        <p class="mt-2 text-lg font-semibold">
          Price: <span id="price"></span>
        </p>
      </div>

      <p id="loading" class="mt-4 text-blue-500 hidden">Calculating...</p>

    </div>

    <!-- RIGHT SIDE - 3D VIEW -->
    <div>
      <div id="viewer" class="w-full h-96 bg-gray-200 rounded-xl"></div>
    </div>

  </div>

</div>

<script>

  const materialRatesUSD = {
    pla: 0.00005,
    abs: 0.00006,
    resin: 0.00012
  };

  const USD_TO_PHP = 56.00;

  const dropZone = document.getElementById("dropZone");
  const fileInput = document.getElementById("fileInput");
  const materialSelect = document.getElementById("materialSelect");
  const currencySelect = document.getElementById("currencySelect");
  const volumeSpan = document.getElementById("volume");
  const priceSpan = document.getElementById("price");
  const resultDiv = document.getElementById("result");
  const loadingText = document.getElementById("loading");

  let lastVolume = 0;

  // =====================
  // THREE JS SETUP
  // =====================

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf3f4f6);

  const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
  camera.position.set(0, 0, 100);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  const viewer = document.getElementById("viewer");
  renderer.setSize(viewer.clientWidth, viewer.clientHeight);
  viewer.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);

  const light1 = new THREE.DirectionalLight(0xffffff, 1);
  light1.position.set(1, 1, 1);
  scene.add(light1);

  const light2 = new THREE.AmbientLight(0xffffff, 0.5);
  scene.add(light2);

  let currentMesh = null;

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  animate();

  // =====================
  // VOLUME CALCULATION
  // =====================

  function calculateVolume(geometry) {
    const position = geometry.attributes.position;
    let totalVolume = 0;

    for (let i = 0; i < position.count; i += 3) {
      const p1 = new THREE.Vector3().fromBufferAttribute(position, i);
      const p2 = new THREE.Vector3().fromBufferAttribute(position, i + 1);
      const p3 = new THREE.Vector3().fromBufferAttribute(position, i + 2);

      totalVolume += p1.dot(p2.cross(p3)) / 6.0;
    }

    return Math.abs(totalVolume);
  }

  function computePrice(volume) {
    const material = materialSelect.value;
    const currency = currencySelect.value;

    let priceUSD = volume * materialRatesUSD[material];

    if (currency === "PHP") {
      return "₱ " + (priceUSD * USD_TO_PHP).toFixed(2);
    } else {
      return "$ " + priceUSD.toFixed(2);
    }
  }

  // =====================
  // FILE HANDLER
  // =====================

  function handleFile(file) {
    if (!file) return;

    loadingText.classList.remove("hidden");
    resultDiv.classList.add("hidden");

    const reader = new FileReader();

    reader.onload = function(event) {
      const loader = new THREE.STLLoader();
      const geometry = loader.parse(event.target.result);

      geometry.center();

      const material = new THREE.MeshStandardMaterial({
        color: 0x2563eb,
        metalness: 0.3,
        roughness: 0.4
      });

      const mesh = new THREE.Mesh(geometry, material);

      if (currentMesh) {
        scene.remove(currentMesh);
      }

      scene.add(mesh);
      currentMesh = mesh;

      const box = new THREE.Box3().setFromObject(mesh);
      const size = box.getSize(new THREE.Vector3()).length();
      const center = box.getCenter(new THREE.Vector3());

      camera.position.copy(center);
      camera.position.x += size;
      camera.position.y += size;
      camera.position.z += size;
      camera.lookAt(center);

      const volume = calculateVolume(geometry);
      lastVolume = volume;

      volumeSpan.innerText = volume.toFixed(2);
      priceSpan.innerText = computePrice(volume);

      loadingText.classList.add("hidden");
      resultDiv.classList.remove("hidden");
    };

    reader.readAsArrayBuffer(file);
  }

  dropZone.addEventListener("dragover", (e) => e.preventDefault());
  dropZone.addEventListener("drop", (e) => {
    e.preventDefault();
    handleFile(e.dataTransfer.files[0]);
  });

  fileInput.addEventListener("change", (e) => {
    handleFile(e.target.files[0]);
  });

  materialSelect.addEventListener("change", () => {
    if (lastVolume > 0)
      priceSpan.innerText = computePrice(lastVolume);
  });

  currencySelect.addEventListener("change", () => {
    if (lastVolume > 0)
      priceSpan.innerText = computePrice(lastVolume);
  });

</script>

</body>
</html>
